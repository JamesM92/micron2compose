name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (parser core — no emulator needed)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release AAR
        run: ./gradlew :micron2compose:assembleRelease --stacktrace
